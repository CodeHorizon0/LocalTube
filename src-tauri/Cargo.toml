[package]
name = "localtube"
version = "0.1.0"
description = "LocalTube"
authors = ["CodeHorizon0"]
edition = "2021"

[lib]
name = "lt"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = "2.0.4"

[dependencies]
tauri = "2.3.0"                                  
tauri-plugin-opener = "2.2.0"
tauri-plugin-dialog = "2.2.0"
tauri-plugin-store = "2.2.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"
tokio = { version = "1", features = ["rt", "process", "fs"] }
base64 = "0.22"
sha2 = "0.10"        
anyhow = "1" 
hex = "0.4"